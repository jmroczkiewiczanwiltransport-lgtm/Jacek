# Pompa ciepła ACOND przez Modbus TCP — do configuration.yaml
# Wygenerowane z opisy-pompy.przyklad.json. Same odczyty: nic nie ustawia w pompie.

modbus:
  - name: acond
    type: tcp
    host: 192.168.88.9
    port: 502
    delay: 5
    timeout: 5
    sensors:
      - name: "Temperatura zewnętrzna"
        address: 10
        slave: 1
        input_type: holding
        data_type: int16
        scan_interval: 30
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      - name: "Temperatura wody w zbiorniku"
        address: 11
        slave: 1
        input_type: holding
        data_type: int16
        scan_interval: 30
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

      - name: "Temperatura zadana"
        address: 12
        slave: 1
        input_type: holding
        data_type: int16
        scan_interval: 30
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement

