# Automatyzacje — do automations.yaml w Home Assistancie.
# Godziny względem słońca liczy sam Home Assistant z ustawionej lokalizacji.
- id: dom_zapal_o_zmierzchu
  alias: Zapal o zmierzchu
  description: 'Wygenerowane z automatyka.json (o: zachod-00:15)'
  triggers:
  - trigger: sun
    event: sunset
    offset: '-00:15:00'
  actions:
  - action: scene.turn_on
    target:
      entity_id: scene.wieczor
  mode: single
- id: dom_przygas_na_noc
  alias: Przygas na noc
  description: 'Wygenerowane z automatyka.json (o: 22:30)'
  triggers:
  - trigger: time
    at: '22:30:00'
  actions:
  - action: scene.turn_on
    target:
      entity_id: scene.noc
  mode: single
- id: dom_zgas_nad_ranem
  alias: Zgas nad ranem
  description: 'Wygenerowane z automatyka.json (o: 01:00)'
  triggers:
  - trigger: time
    at: '01:00:00'
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.ledy_front
      - light.ledy_prawa_strona
      - light.ledy_lewa_strona
      - light.ledy_ogrod
    data:
      transition: 30
  - action: switch.turn_off
    target:
      entity_id:
      - switch.garaz
  mode: single
- id: dom_doswietl_przed_swiatem
  alias: Doswietl przed swiatem
  description: 'Wygenerowane z automatyka.json (o: wschod-01:00)'
  triggers:
  - trigger: sun
    event: sunrise
    offset: '-01:00:00'
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - action: light.turn_on
    target:
      entity_id:
      - light.ledy_front
      - light.ledy_prawa_strona
      - light.ledy_lewa_strona
    data:
      brightness: 102
      color_temp_kelvin: 3080
  mode: single
- id: dom_zgas_o_wschodzie
  alias: Zgas o wschodzie
  description: 'Wygenerowane z automatyka.json (o: wschod+00:15)'
  triggers:
  - trigger: sun
    event: sunrise
    offset: '+00:15:00'
  actions:
  - action: light.turn_off
    target:
      entity_id:
      - light.ledy_front
      - light.ledy_prawa_strona
      - light.ledy_lewa_strona
      - light.ledy_ogrod
    data:
      transition: 60
  - action: switch.turn_off
    target:
      entity_id:
      - switch.garaz
  mode: single
