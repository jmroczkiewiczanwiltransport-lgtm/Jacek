<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Kurs na czas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Układ: pełnoekranowa scena 3D; nad nią HUD i plansze w formie tablic drogowych; sterowanie dotykowe w dolnych rogach. */
:root{
  --sign:#0b6b43;            /* zieleń tablic na drodze ekspresowej */
  --sign-deep:#07492e;
  --paint:#f4f6f1;           /* biel odblaskowa */
  --asphalt:#14171b;
  --asphalt-soft:rgba(17,20,24,.8);
  --warn:#f5c518;            /* żółć oznakowania robót */
  --stop:#de382e;
  --ink:#0e1113;
  --paper:#f3f4ef;
  --muted:#a9b3ad;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--asphalt);color:var(--paint);font-family:var(--body);font-size:15px;overflow:hidden}
.stage{position:relative;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- HUD */
.hud{position:absolute;inset:0 0 auto 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;
  padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.lbl{font:600 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.plate{background:var(--asphalt-soft);border:1px solid rgba(244,246,241,.2);border-radius:6px;padding:7px 10px 8px;display:grid;gap:3px;min-width:84px}
.plate.cargo{justify-self:start}
.plate.speed{justify-self:end;grid-template-columns:auto auto;align-items:center;column-gap:8px}
.plate.speed .lbl{grid-column:1/-1}
.num{font:700 clamp(26px,7vw,34px)/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:4px;background:rgba(244,246,241,.2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--paint);transform-origin:left center}
.plate.cargo.hurt{border-color:var(--stop)}
.plate.cargo.hurt .num{color:var(--stop)}
.plate.cargo.hurt .bar i{background:var(--stop)}
.lim{width:30px;height:30px;border-radius:50%;background:#fff;border:4px solid var(--stop);color:#111;font:700 14px/22px var(--display);text-align:center}
.timer{background:var(--sign);color:var(--paint);border:3px solid var(--paint);border-radius:12px;box-shadow:0 0 0 3px var(--sign),0 8px 22px rgba(0,0,0,.4);
  padding:6px 16px 8px;text-align:center;display:grid;gap:2px;min-width:148px}
.timer .lbl{color:inherit;opacity:.85;white-space:nowrap}
.clock{font:700 clamp(40px,11vw,56px)/.92 var(--display);font-variant-numeric:tabular-nums}
.sub{font:600 14px/1.1 var(--display);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub b{font-weight:700}
.prog{height:4px;background:rgba(0,0,0,.28);border-radius:2px;overflow:hidden;margin-top:3px}
.prog i{display:block;height:100%;background:currentColor;transform-origin:left center}
.timer.low{background:var(--warn);color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 3px var(--warn),0 8px 22px rgba(0,0,0,.4)}
.timer.late{background:var(--stop);color:#fff;border-color:#fff;box-shadow:0 0 0 3px var(--stop),0 8px 22px rgba(0,0,0,.4)}
.tools{position:absolute;top:84px;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.tool{width:40px;height:40px;border-radius:6px;border:1px solid rgba(244,246,241,.28);background:var(--asphalt-soft);color:var(--paint);display:grid;place-items:center;cursor:pointer;padding:0}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool:focus-visible,.go:focus-visible,.ghost:focus-visible{outline:3px solid var(--warn);outline-offset:3px}
.toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);max-width:min(86%,420px);background:var(--warn);color:var(--ink);
  font:700 19px/1.15 var(--display);letter-spacing:.03em;text-transform:uppercase;text-align:center;padding:9px 16px;border-radius:6px;
  box-shadow:inset 0 0 0 2px var(--ink),0 6px 18px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .18s}
.toast.on{opacity:1}
.toast.bad{background:var(--stop);color:#fff;box-shadow:inset 0 0 0 2px #fff,0 6px 18px rgba(0,0,0,.35)}
.flash{position:absolute;inset:0;background:var(--stop);opacity:0;pointer-events:none}

/* ---------- sterowanie dotykowe */
.touch{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;align-items:flex-end;gap:12px;
  padding-bottom:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.is-touch.driving .touch{display:flex}
.steer{pointer-events:auto;position:relative;width:min(48vw,240px);height:96px;border-radius:48px;background:var(--asphalt-soft);
  border:2px solid rgba(244,246,241,.4);display:flex;justify-content:space-between;align-items:center;padding:0 20px;color:var(--paint)}
.steer svg{width:26px;height:26px;fill:currentColor;opacity:.75}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--paint);opacity:.92;pointer-events:none}
.pedals{display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.horn,.brake{pointer-events:auto;border:2px solid rgba(244,246,241,.5);color:var(--paint);font:700 15px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;display:grid;place-items:center}
.horn{width:64px;height:64px;border-radius:50%;background:var(--asphalt-soft)}
.horn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brake{width:min(34vw,150px);height:96px;border-radius:14px;background:rgba(222,56,46,.82)}
.brake.on{background:var(--stop);border-color:#fff}
.horn.on{background:var(--warn);color:var(--ink)}

/* ---------- plansze */
.overlay{position:absolute;inset:0;display:grid;place-items:center;overflow:auto;touch-action:pan-y;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(8,10,12,.3),rgba(8,10,12,.58))}
.sign{width:min(100%,470px);background:var(--sign);color:var(--paint);border-radius:18px;padding:6px;box-shadow:0 20px 56px rgba(0,0,0,.5)}
.sign-in{border:3px solid var(--paint);border-radius:13px;padding:18px 22px 20px;display:grid;gap:13px}
.eyebrow{margin:0;font:600 14px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.sign h1,.sign h2{margin:0;font:700 clamp(42px,12vw,62px)/.9 var(--display);text-transform:uppercase;letter-spacing:.005em;text-wrap:balance}
.sign h2{font-size:clamp(34px,9vw,44px)}
.lead{margin:0;font:500 16px/1.4 var(--body);max-width:44ch}
.rows{margin:0;display:grid}
.rows div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:7px 0;border-top:1px solid rgba(244,246,241,.3)}
.rows dt{font:500 14px/1.2 var(--body);opacity:.9}
.rows dd{margin:0;font:600 20px/1.1 var(--display);letter-spacing:.02em;text-align:right;font-variant-numeric:tabular-nums}
.note{margin:0;font:500 14px/1.4 var(--body);background:var(--sign-deep);border-radius:6px;padding:9px 12px}
.note b{font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.go,.ghost{flex:1 1 150px;font:700 22px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;border-radius:8px;padding:14px 16px;cursor:pointer}
.go{background:var(--warn);color:var(--ink);border:0;box-shadow:inset 0 0 0 3px var(--ink)}
.ghost{background:transparent;color:inherit;border:2px solid currentColor}
.small{margin:0;font:500 13px/1.35 var(--body);opacity:.85}
.paper{position:relative;width:min(100%,470px);background:var(--paper);color:var(--ink);border-radius:3px;padding:20px 22px 22px;display:grid;gap:12px;box-shadow:0 20px 56px rgba(0,0,0,.5)}
.paper header{border-bottom:3px solid var(--ink);padding-bottom:8px}
.paper h2{margin:0;font:700 30px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.paper .no{font:600 14px/1 var(--display);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.paper .rows div{border-top:1px solid rgba(14,17,19,.18)}
.paper .rows div:first-child{border-top:0}
.paper .rows .total{border-top:2px solid var(--ink);margin-top:4px;padding-top:10px}
.paper .rows .total dt{font-weight:600;font-size:15px}
.paper .rows .total dd{font-size:30px;font-weight:700}
.paper .minus{color:#b3261e}
.paper .cap{margin:6px 0 0;font:600 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:#5b635e}
.paper .ghost{border-color:var(--ink)}
.paper .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
.stamp{transform:rotate(-6deg);border:3px solid var(--sign);color:var(--sign);font:700 20px/1 var(--display);
  letter-spacing:.14em;text-transform:uppercase;padding:6px 10px 5px;border-radius:4px}
.stamp.bad{border-color:#b3261e;color:#b3261e}
@media (max-height:520px){
  .sign-in{padding:12px 18px 14px;gap:9px}
  .sign h1{font-size:38px}
  .rows div{padding:4px 0}
  .tools{top:82px}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

<div class="stage" id="stage">
  <canvas id="gl" aria-label="Widok 3D: ciężarówka na drodze ekspresowej"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="plate cargo" id="hCargoBox">
      <span class="lbl">Ładunek</span>
      <span class="num" id="hCargo">100%</span>
      <span class="bar"><i id="hCargoBar"></i></span>
    </div>
    <div class="timer" id="hTimerBox">
      <span class="lbl" id="hTimerLbl">Okno rozładunku</span>
      <span class="clock" id="hTimer">0:00</span>
      <span class="sub"><span id="hDist">0,0 km</span> · zapas <b id="hMargin">+0:00</b></span>
      <span class="prog"><i id="hProg"></i></span>
    </div>
    <div class="plate speed">
      <span class="lbl">km/h</span>
      <span class="num" id="hSpeed">0</span>
      <span class="lim" title="Ogranicznik prędkości">90</span>
    </div>
  </div>
  <div class="tools" id="tools" hidden>
    <button class="tool" id="bMute" type="button" aria-label="Dźwięk"></button>
    <button class="tool" id="bPause" type="button" aria-label="Pauza"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="flash" id="flash"></div>

  <div class="touch" id="touch">
    <div class="steer" id="tSteer" aria-label="Kierownica">
      <svg viewBox="0 0 24 24"><path d="M15 4 6 12l9 8z"/></svg>
      <span class="knob" id="tKnob"></span>
      <svg viewBox="0 0 24 24"><path d="M9 4l9 8-9 8z"/></svg>
    </div>
    <div class="pedals">
      <div class="horn" id="tHorn" role="button" aria-label="Klakson"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l6 4V6l-6 4z"/><path d="M17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11"/></svg></div>
      <div class="brake" id="tBrake" role="button">Hamulec</div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const stage=$('stage'), canvas=$('gl'), overlay=$('overlay');
const T=window.THREE;
function fatal(msg){ overlay.hidden=false; overlay.innerHTML='<div class="sign"><div class="sign-in"><h1>Kurs na czas</h1><p class="lead">'+msg+'</p></div></div>'; }
if(!T){ fatal('Nie udało się wczytać silnika 3D (three.js). Sprawdź połączenie z internetem i odśwież stronę.'); return; }
let renderer;
try{ renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ fatal('Ta przeglądarka nie udostępnia grafiki 3D (WebGL). Otwórz grę w aktualnym Chrome, Edge, Firefoksie lub Safari.'); return; }

// ---------- narzędzia
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, smooth=t=>t*t*(3-2*t);
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s+0x6D2B79F5)>>>0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const fmtTime=s=>{ const n=Math.abs(Math.round(s)); return Math.floor(n/60)+':'+String(n%60).padStart(2,'0'); };
const fmtKm=m=>(Math.max(0,m)/1000).toFixed(1).replace('.',',')+' km';
const fmtZl=n=>(n<0?'−':'')+String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' zł';
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={ get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

// ---------- stałe drogi (metry). Oś X w poprzek, jazda w stronę -Z.
const LANE_X=[-3.5,0,3.5];                 // lewy, środkowy, prawy pas
const ROAD_L=-6.0, ROAD_R=7.75;            // krawędzie asfaltu (z prawej pas awaryjny 5,25–7,75)
const RAIL_L=-6.45, RAIL_R=8.25;           // bariery
const VMAX=25;                             // ogranicznik 90 km/h
const PHL=8, PHW=1.275;                    // połowa długości i szerokości zestawu
const X_MIN=RAIL_L+0.2+PHW, X_MAX=RAIL_R-0.2-PHW;
const ROAD_LEN=660, ROAD_Z0=40;

// ---------- scena
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new T.Scene();
scene.fog=new T.Fog(0xcfe4f2,140,560);
const camera=new T.PerspectiveCamera(50,1,1,1300);
const world=new T.Group(); scene.add(world);           // wszystko przypięte do trasy: z = -s
const routeGroup=new T.Group(); world.add(routeGroup); // elementy danego kursu

// Zakrzywienie świata: przesunięcie wierzchołków w przestrzeni widoku ~ kwadrat głębi.
const bend={uCurve:{value:0},uHill:{value:0}};
function bendCompile(sh){
  sh.uniforms.uCurve=bend.uCurve; sh.uniforms.uHill=bend.uHill;
  sh.vertexShader='uniform float uCurve;\nuniform float uHill;\n'+sh.vertexShader.replace('#include <project_vertex>',
    '#include <project_vertex>\n float bd=mvPosition.z*mvPosition.z;\n mvPosition.x+=uCurve*bd;\n mvPosition.y+=uHill*bd;\n gl_Position=projectionMatrix*mvPosition;');
}
const bendMat=m=>{ m.onBeforeCompile=bendCompile; return m; };
const lam=(color,o)=>bendMat(new T.MeshLambertMaterial(Object.assign({color},o)));
const bas=(color,o)=>bendMat(new T.MeshBasicMaterial(Object.assign({color},o)));
const noCull=o=>{ o.traverse(m=>{ m.frustumCulled=false; }); return o; };

// ---------- tekstury rysowane w locie
function canvasTex(w,h,draw,repeat){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c); if(repeat){ t.wrapS=t.wrapT=T.RepeatWrapping; } t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
const texRoad=canvasTex(512,512,(g)=>{
  g.fillStyle='#3b3e43'; g.fillRect(0,0,512,512);
  for(let i=0;i<7000;i++){ const v=38+Math.random()*46|0; g.fillStyle='rgba('+v+','+v+','+(v+4)+',.32)'; g.fillRect(Math.random()*512,Math.random()*512,2,2); }
  const X=x=>(x-ROAD_L)/(ROAD_R-ROAD_L)*512;
  g.fillStyle='rgba(0,0,0,.2)'; g.fillRect(X(5.25),0,512-X(5.25),512);
  g.fillStyle='rgba(0,0,0,.1)'; for(const lx of LANE_X) for(const o of [-0.95,0.95]) g.fillRect(X(lx+o)-7,0,14,512);
  g.fillStyle='#eef0ea'; g.fillRect(X(-5.25)-4,0,8,512); g.fillRect(X(5.25)-4,0,8,512);
  const pm=512/24; for(const lx of [-1.75,1.75]) for(let k=0;k<2;k++) g.fillRect(X(lx)-3,k*12*pm,6,4*pm);   // P-1: 4 m kreska, 8 m przerwa
},true);
texRoad.repeat.set(1,ROAD_LEN/24);
const texFields=canvasTex(512,512,(g)=>{
  g.fillStyle='#5f8b3e'; g.fillRect(0,0,512,512);
  const cols=['#6b9a44','#517d37','#7da64b','#c9be4a','#8a7a50','#587f3b','#6f9440','#a9b05a'];
  for(let i=0;i<46;i++){ g.fillStyle=pick(cols); g.globalAlpha=.85; const w=40+Math.random()*150,h=40+Math.random()*170; g.fillRect(Math.random()*512-20,Math.random()*512-20,w,h); }
  g.globalAlpha=1;
},true);
const texGlow=canvasTex(64,64,(g)=>{ const gr=g.createRadialGradient(32,32,2,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.35,'rgba(255,255,255,.45)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); });
const texShadow=canvasTex(64,128,(g)=>{ g.clearRect(0,0,64,128); g.fillStyle='rgba(0,0,0,.42)'; g.filter='blur(6px)'; rr(g,12,12,40,104,10); g.fill(); });
const texStripes=canvasTex(128,32,(g)=>{ g.fillStyle='#f4f4f0'; g.fillRect(0,0,128,32); g.fillStyle='#d5281f'; for(let i=-1;i<5;i++){ g.beginPath(); g.moveTo(i*32,32); g.lineTo(i*32+16,32); g.lineTo(i*32+32,0); g.lineTo(i*32+16,0); g.closePath(); g.fill(); } });
const texScreen=canvasTex(64,64,(g)=>{ g.fillStyle='#3f7d5c'; g.fillRect(0,0,64,64); g.fillStyle='#a9c6cf'; g.fillRect(0,0,64,18); g.fillStyle='#2c5f44'; g.fillRect(0,18,64,3); g.fillRect(0,0,4,64); g.fillStyle='rgba(0,0,0,.12)'; g.fillRect(0,40,64,2); },true);
const SIGN_FONT='"Barlow Condensed","Arial Narrow",Arial,sans-serif';
function signTex(kind,l1,l2,closed){
  return canvasTex(384,192,(g)=>{
    const green=kind==='green', fg=green?'#f4f6f1':'#111';
    g.fillStyle=green?'#0b6b43':'#f5c518'; rr(g,0,0,384,192,20); g.fill();
    g.strokeStyle=fg; g.lineWidth=8; rr(g,9,9,366,174,13); g.stroke();
    g.fillStyle=fg; g.textAlign='center'; g.textBaseline='middle';
    const cx=closed==null?192:140;
    g.font='700 46px '+SIGN_FONT; g.fillText(l1,cx,66);
    g.font='700 70px '+SIGN_FONT; g.fillText(l2,cx,128);
    if(closed!=null){ g.lineWidth=9; g.lineCap='round';      // schemat pasów: zamknięty kończy się czerwoną belką
      for(let i=0;i<3;i++){ const x=286+i*30; g.strokeStyle='#111'; g.beginPath();
        if(i===closed){ g.moveTo(x,160); g.lineTo(x,98); g.stroke(); g.strokeStyle='#d5281f'; g.beginPath(); g.moveTo(x-12,90); g.lineTo(x+12,90); g.stroke(); }
        else { g.moveTo(x,160); g.lineTo(x,44); g.stroke(); g.beginPath(); g.moveTo(x-9,56); g.lineTo(x,42); g.lineTo(x+9,56); g.stroke(); } } }
  });
}

// ---------- geometrie scalane z klocków (jeden mesh na pojazd)
const UB=new T.BoxGeometry(1,1,1);
const UC=new T.CylinderGeometry(1,1,1,10); UC.rotateZ(Math.PI/2);       // koło: oś wzdłuż X
const UP=new T.PlaneGeometry(1,1);
function P(geo,color,sx,sy,sz,x,y,z){ const g=geo.clone(); g.scale(sx,sy,sz); g.translate(x,y,z);
  const n=g.attributes.position.count, c=new Float32Array(n*3), col=new T.Color(color);
  for(let i=0;i<n;i++){ c[i*3]=col.r; c[i*3+1]=col.g; c[i*3+2]=col.b; }
  g.setAttribute('color',new T.BufferAttribute(c,3)); return g; }

    h.position.set(42,0,-(c.dist+ds)); routeGroup.add(noCull(h)); }

const matScreenWall=lam(0xffffff,{map:texScreen});

function populate(){
  for(const t of trees) placeTree(t,rnd(-40,TREE_SPAN-40)); imTrunk.instanceMatrix.needsUpdate=imCon.instanceMatrix.needsUpdate=imDec.instanceMatrix.needsUpdate=true;
  turbines.forEach((t,i)=>placeTurbine(t,200+i*330+rnd(0,120)));
  const n=attract?9:contract.dens; let guard=0;
  while(cars.filter(c=>!c.static&&!c.onc).length<n && guard++<200) spawn(rnd(attract?40:75,env.ff+150));
  for(let i=0;i<7;i++){ const c=makeCar(typeFor(pick([0,1,2])),{onc:true,x:pick(ONC_X),s:rnd(-80,700),v:-rnd(22,31)}); c.g.position.set(c.x,0,-c.s); }
}
function laneClosed(l,a,b){ for(const z of zones) if(z.lane===l && z.s0-40<b && z.s0+z.len>a) return true; return false; }
function spawn(ds){
  const lane=attract?pick([0,2]):pick([0,1,1,2,2]), s=player.s+ds, type=typeFor(lane), hl=VT[type].hl;
  if(laneClosed(lane,s-60,s+60)) return null;
  for(const o of cars) if(!o.onc && Math.abs(o.x-LANE_X[lane])<2.6 && Math.abs(o.s-s)<o.hl+hl+16) return null;
  const v=speedFor(lane)-(type==='semi'||type==='truck'?1:0);
  const c=makeCar(type,{lane,tLane:lane,pLane:lane,x:LANE_X[lane],s,v,vT:v}); c.g.position.set(c.x,0,-c.s); return c;
}
function spawnElephants(e){ e.done=true; const s=player.s+env.ff+70;
  for(const o of cars.slice()) if(!o.onc&&!o.static&&o.lane>=1&&Math.abs(o.s-s)<60) removeCar(o);
  if(laneClosed(1,s-80,s+500)||laneClosed(2,s-80,s+500)) return;
  const a=makeCar('semi',{lane:2,tLane:2,x:LANE_X[2],s:s+14,v:13.6,vT:13.6,noLC:true});
  const b=makeCar('semi',{lane:1,tLane:1,x:LANE_X[1],s,v:14.5,vT:14.5,noLC:true,eleph:true,mate:a}); a.g.position.set(a.x,0,-a.s); b.g.position.set(b.x,0,-b.s); }

function setupContract(i,asAttract){
  cIdx=i; contract=contractAt(i); attract=asAttract; clearRoute(); applyEnv(ENV[contract.env]);
  player.x=0; player.s=0; player.v=asAttract?20:16; player.vx=0; player.steer=0; player.cargo=100; camX=0; yawT=yawTr=0;
  tLeft=contract.time; shake=0; hits=0; hornCd=0; scrapeT=0; lastTick=99; arriveT=0;
  if(asAttract){ depot=1e9; ph=[1,2,3,4]; } else buildRoute(contract,i+1);
  populate();
}

// ---------- ruch pozostałych pojazdów
function laneFree(c,l,tm,tight){
  if(l<0||l>2||laneClosed(l,c.s-30,c.s+330)) return false;
  const lx=LANE_X[l];
  for(const o of cars){ if(o===c||o.onc) continue; if(Math.abs(o.x-lx)>o.hw+c.hw+0.5 && o.tLane!==l) continue;
    const d=o.s-c.s, need=o.hl+c.hl; if(d>-(need+(tight?7:10)+Math.max(0,o.v-c.v)*(tight?1.1:2.5)) && d<need+(tight?6:14)+Math.max(0,c.v-o.v)*2.5) return false; }
  if(!attract && Math.abs(player.x-lx)<PHW+c.hw+0.9){ const d=c.s-player.s, need=PHL+c.hl; if(d>-(need+6) && d<need+6+Math.max(0,player.v-c.v)*tm) return false; }
  return true;
}
function startChange(c,l,t){ c.st='sig'; c.t=t; c.tLane=l; }
function think(c){
  if(c.st!=='keep'||c.noLC&&!c.eleph) return;
  if(c.eleph){ if(c.mate&&c.s>c.mate.s+26){ c.eleph=false; c.noLC=false; } return; }
  const lc=attract?0:contract.lc; let want=-1, forced=false;
  for(const z of zones) if(z.lane===c.lane && c.s<z.s0+z.len && z.s0-c.s<280){ want=1; forced=true; }
  if(want<0 && c.gap<42 && c.leadV<c.vT-1.2 && Math.random()<.45*lc) want=(c.lane>0&&Math.random()<.7)?c.lane-1:c.lane+1;
  if(want<0 && Math.random()<.03*lc) want=c.lane+(Math.random()<.5?-1:1);
  if(want<0 && c.heavy && c.lane<2 && Math.random()<.06*lc) want=c.lane+1;
  if(want<0||want>2||want===c.lane) return;
  const tm=forced?1.6:(Math.random()<contract.cut?.7:3.2);
  if(laneFree(c,want,tm,forced&&c.v<4)) startChange(c,want,rnd(.9,1.4));
}
function updateCar(c,dt){
  c.hitCd-=dt;
  if(c.onc){ c.s+=c.v*dt; if(c.s<player.s-110){ c.s=player.s+env.ff+rnd(60,260); c.x=pick(ONC_X); } c.g.position.set(c.x,0,-c.s); return; }
  if(c.static){ if(c.v>0){ c.v=Math.max(0,c.v-4.5*dt); c.s+=c.v*dt; c.g.position.z=-c.s; }
    const on=(time*2.2)%1<.5; if(c.haz){ c.bl.visible=c.br.visible=on; } if(c.bm) c.bm.visible=on; return; }
  // najbliższa przeszkoda z przodu: pojazd, gracz albo zamknięty pas
  let gap=1e9, lv=0;
  for(const o of cars){ if(o===c||o.onc||o.s<=c.s) continue; if(Math.abs(o.x-c.x)>o.hw+c.hw+0.3) continue; const g=o.s-o.hl-c.s-c.hl; if(g<gap){ gap=g; lv=o.v; } }
  if(player.s>c.s && Math.abs(player.x-c.x)<PHW+c.hw+0.2){ const g=player.s-PHL-c.s-c.hl; if(g<gap){ gap=g; lv=player.v; } }
  for(const z of zones) if(z.lane===c.lane && z.s0-2>c.s){ const g=z.s0-2-c.s-c.hl; if(g<gap){ gap=g; lv=0; } }
  c.gap=gap; c.leadV=lv;
  let des=c.vT; if(gap<80) des=Math.min(c.vT,Math.max(0,lv+(gap-(5+c.v*.8))*.5));
  const dv=des-c.v; c.v=Math.max(0,c.v+clamp(dv,-6.5*dt,1.4*dt)); c.brk=dv<-.8;
  c.think-=dt; if(c.think<=0){ c.think=.5; think(c); }
  if(c.st==='sig'){ c.t-=dt; if(c.t<=0){ if(laneFree(c,c.tLane,.5)){ c.st='move'; c.t=0; c.fromX=c.x; c.pLane=c.lane; c.lane=c.tLane; } else { c.st='keep'; c.tLane=c.lane; } } }
  else if(c.st==='move'){ c.t+=dt/2.1; c.x=lerp(c.fromX,LANE_X[c.tLane],smooth(Math.min(1,c.t))); if(c.t>=1){ c.st='keep'; c.x=LANE_X[c.lane]; } }

// ---------- gracz
const keys={}; let touchSteer=0, touchBrake=false;
function readInput(){ let st=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0); if(touchSteer) st=touchSteer; return {st,br:!!(keys.arrowdown||keys.s||keys[' ']||touchBrake)}; }
function hurt(pct,label){
  const d=pct*contract.frag; player.cargo=Math.max(0,player.cargo-d); hits++; shake=Math.min(1,shake+.25+d/14); sndCrash(clamp(d/12,.25,1));
  toast((label||'Szkoda')+' · −'+Math.max(1,Math.round(d))+'% ładunku','bad',1500); flash(.32);
  if(player.cargo<=0) fail('cargo');
}
function updatePlayer(dt){
  const p=player, driving=state==='drive', inp=driving?readInput():{st:0,br:state==='fail'||(state!=='menu'&&p.s>depot+40)};
  const mf=contract.mass/18;
  p.steer+=(inp.st-p.steer)*Math.min(1,dt*8);
  const onShoulder=p.x>4.35, cap=attract?20:(onShoulder?16.7:VMAX);
  if(inp.br) p.v=Math.max(0,p.v-(env.brake/Math.sqrt(mf))*(driving?1:.75)*dt);
  else if(p.v<cap) p.v=Math.min(cap,p.v+(2.5/Math.pow(mf,.7))*(1-.72*(p.v/VMAX)*(p.v/VMAX))*dt);
  else p.v=Math.max(cap,p.v-3*dt);
  const drift=attract?0:-curveAt(p.s)*p.v*p.v*2.6;
  p.vx=p.steer*Math.min(4.6,Math.max(.21*p.v,driving&&!inp.br?.9:0))+drift;   // minimum bocznego ruchu, żeby dało się wyjechać zza stojącego pojazdu
  p.x+=p.vx*dt;
  if(p.x<X_MIN||p.x>X_MAX){ p.x=clamp(p.x,X_MIN,X_MAX);
    if(driving&&p.v>4){ p.v*=1-.35*dt; scrapeT+=dt; shake=Math.max(shake,.25); if(scrapeT>.45){ scrapeT=0; hurt(1.6,'Bariera'); } } }
  else scrapeT=Math.max(0,scrapeT-dt*.5);
  if(driving&&onShoulder&&p.v>6) shake=Math.max(shake,.12);
  p.s+=p.v*dt;
}
function collide(dt){
  const p=player;
  for(const c of cars){ if(c.onc) continue;
    const dx=c.x-p.x, ds=c.s-p.s, px=PHW+c.hw-Math.abs(dx), ps=PHL+c.hl-Math.abs(ds);
    if(px<=0||ps<=0) continue;
    if(px<ps){                                    // otarcie bokiem
      p.x=clamp(p.x-Math.sign(dx||1)*px,X_MIN,X_MAX);
      if(c.st==='move'){ c.tLane=c.pLane; c.lane=c.pLane; c.fromX=c.x; c.t=0; } else if(c.st==='sig'){ c.st='keep'; c.tLane=c.lane; }
      if(c.hitCd<=0){ c.hitCd=.6; p.v*=.96; hurt(1.5+Math.abs(p.vx)*.7,'Otarcie'); }
    } else if(ds>0){                              // najechanie na tył
      const rel=p.v-c.v; p.s=c.s-c.hl-PHL-.02;
      if(rel>1.2){ p.v-=rel*.6; c.v=p.v+1.5; if(c.hitCd<=0){ c.hitCd=.4; hurt(2+rel*1.1,'Najechanie'); } }
      else p.v=Math.min(p.v,c.v);
    } else {                                      // ktoś wjechał w naczepę
      const rel=c.v-p.v; c.s=p.s-PHL-c.hl-.02; c.v=Math.min(c.v,p.v);
      if(rel>1.2&&c.hitCd<=0){ c.hitCd=.6; hurt(1.5+rel*.5,'Uderzenie w naczepę'); }
    }
    if(state!=='drive') return;
  }
  let dirty=false;
  for(let i=0;i<cones.length;i++){ const c=cones[i]; if(c.gone) continue;
    if(c.fly){ c.vy-=22*dt; c.y+=c.vy*dt; c.x+=c.vx*dt; c.s+=c.vs*dt; c.rx+=7*dt; c.rz+=5*dt; if(c.y<-1) c.gone=true; coneMatrix(i); dirty=true; continue; }
    if(Math.abs(c.s-p.s)<PHL+.2 && Math.abs(c.x-p.x)<PHW+.22){ c.fly=true; c.vy=6+p.v*.12; c.vx=(c.x>=p.x?1:-1)*rnd(2,6); c.vs=p.v*1.15; p.v=Math.max(0,p.v-.7); hurt(.8,'Pachołek'); } }
  if(dirty) coneMesh.instanceMatrix.needsUpdate=true;
  for(const b of barriers){
    if(b.fly){ b.vy-=20*dt; b.g.position.y+=b.vy*dt; b.s+=b.vs*dt; b.g.position.z=-b.s; b.g.rotation.x-=4*dt; if(b.g.position.y<-3){ b.g.visible=false; } continue; }
    b.glow.visible=(time*2.2)%1<.5;
    if(Math.abs(b.s-p.s)<PHL+.1 && Math.abs(b.x-p.x)<PHW+1.5){ b.fly=true; b.vy=7; b.vs=p.v*1.1; p.v*=.72; hurt(8,'Zapora'); } }
}

// ---------- pętla symulacji
function update(dt){
  time+=dt;
  const driving=state==='drive';
  updatePlayer(dt);
  for(const c of cars) updateCar(c,dt);
  for(let i=cars.length-1;i>=0;i--) if(cars[i].dead) removeCar(cars[i]);
  if(driving) collide(dt);
  spawnT-=dt;
  if(spawnT<=0){ spawnT=.35; const n=attract?9:contract.dens; if(cars.filter(c=>!c.static&&!c.onc).length<n) spawn(env.ff+rnd(30,170)); }
  if(driving){
    tLeft-=dt; hornCd=Math.max(0,hornCd-dt);
    for(const z of zones) if(!z.warned&&player.s>z.s0-330){ z.warned=true; toast('Roboty · '+(z.lane===2?'prawy':'lewy')+' pas zamknięty za 300 m','',2600); }
    for(const e of elephs) if(!e.done&&player.s>e.s-env.ff-70) spawnElephants(e);
    if(tLeft<10.5&&tLeft>0){ const k=Math.ceil(tLeft); if(k!==lastTick){ lastTick=k; sndTick(); } }
    if(tLeft<-30) fail('late');
    else if(player.s+PHL>=depot) arrive();
  } else if(state==='arrived'){ arriveT+=dt; if(arriveT>1.7) showResult(); }
  // drzewa i wiatraki
  let dirty=false; for(const t of trees) if(t.s<player.s-45){ placeTree(t,t.s+TREE_SPAN+rnd(-10,10)); dirty=true; }
  if(dirty) imTrunk.instanceMatrix.needsUpdate=imCon.instanceMatrix.needsUpdate=imDec.instanceMatrix.needsUpdate=true;
  for(const t of turbines){ t.rotor.rotation.z+=t.sp*dt; if(t.s<player.s-80) placeTurbine(t,player.s+rnd(700,1000)); }
  shake=Math.max(0,shake-dt*2.2);
}

      const o=i*6; rainPos[o]=r[0]+camX; rainPos[o+1]=r[1]; rainPos[o+2]=r[2]; rainPos[o+3]=r[0]+camX; rainPos[o+4]=r[1]+1.2; rainPos[o+5]=r[2]-.5-v*.012; }

  try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; AC=new C(); master=AC.createGain(); master.gain.value=muted?0:1; master.connect(AC.destination);
    const o1=AC.createOscillator(), o2=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain(); o1.type='sawtooth'; o2.type='square'; f.type='lowpass'; f.frequency.value=240; g.gain.value=0;

    const nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const ns=AC.createBufferSource(); ns.buffer=nb; ns.loop=true; const nf=AC.createBiquadFilter(), ng=AC.createGain(); nf.type='lowpass'; nf.frequency.value=500; ng.gain.value=0; ns.connect(nf); nf.connect(ng); ng.connect(master); ns.start();

}

  const f=34+p.v*2.3; eng.o1.frequency.setTargetAtTime(f,t,.08); eng.o2.frequency.setTargetAtTime(f*.5,t,.08); eng.g.gain.setTargetAtTime(on?.05:0,t,.15);
  const rough=on?((p.x>4.35&&p.v>6?.16:0)+(env.rain?.035:0)+p.v*.0012):0; eng.nf.frequency.setTargetAtTime(p.x>4.35?160:env.rain?2600:700,t,.1); eng.ng.gain.setTargetAtTime(rough,t,.12); }
function blip(type,f0,f1,dur,vol,delay){ if(!AC) return; const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter(); o.type=type; f.type='lowpass'; f.frequency.value=1800;
  o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0008,t+dur);

  g.gain.setValueAtTime(.5*k,t); g.gain.exponentialRampToValueAtTime(.001,t+.25+k*.3); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+.7); blip('sine',90,32,.3,.4*k); }

function honk(){
  if(state!=='drive'||hornCd>0) return; hornCd=2.5; sndHorn(); $('tHorn').classList.add('on'); setTimeout(()=>$('tHorn').classList.remove('on'),350);
  for(const c of cars){ if(c.onc||c.static) continue; const d=c.s-player.s; if(d<0||d>90) continue;
    if(c.st==='sig'&&Math.abs(LANE_X[c.tLane]-player.x)<2.4){ c.st='keep'; c.tLane=c.lane; continue; }
    if(c.st!=='keep'||Math.abs(c.x-player.x)>2.2) continue;
    if(c.eleph||c.noLC){ if(!c.honked){ c.honked=true; c.vT+=2.6; } continue; }
    const opts=[c.lane+1,c.lane-1].filter(l=>laneFree(c,l,1.2));
    if(opts.length&&Math.random()<.8) startChange(c,opts[0],.4); else if(!c.honked){ c.honked=true; c.vT=Math.min(c.vT+2.2,23); } }
}

function pause(){ if(state!=='drive') return; state='pause'; stage.classList.remove('driving');
  board('<div class="sign"><div class="sign-in"><p class="eyebrow">Zlecenie nr '+contract.n+' · '+contract.cargo+'</p><h2>Postój</h2>'+controlsHtml()+'<div class="btns"><button class="go" type="button" data-act="resume">Jedź dalej</button><button class="ghost" type="button" data-act="retry">Kurs od nowa</button></div></div></div>'); }
function resume(){ if(state!=='pause') return; state='drive'; overlay.hidden=true; stage.classList.add('driving'); for(const k in keys) keys[k]=false; }
overlay.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='go') startDrive();
  else if(a==='resume') resume();
  else if(a==='retry'){ if(state==='result') career-=lastNet; startDrive(); }
  else if(a==='next'){ setupContract(cIdx+1,true); showBrief(false); }
  else if(a==='menu'){ career=0; setupContract(0,true); showBrief(true); } });
$('bPause').addEventListener('click',()=>pause());
$('bMute').addEventListener('click',()=>{ initAudio(); toggleMute(); });

// ---------- wejście
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(state==='drive'){ if(['arrowleft','arrowright','arrowdown','arrowup',' '].includes(k)) e.preventDefault();
    if((k==='h'||k==='k')&&!e.repeat) honk(); if(k==='p'||k==='escape'){ pause(); return; } }
  else if(state==='pause'&&(k==='p'||k==='escape')){ resume(); return; }
  if(k==='m'&&!e.repeat) toggleMute();
  keys[k]=true; });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });
if(window.matchMedia&&matchMedia('(pointer: coarse)').matches) stage.classList.add('is-touch');
addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') stage.classList.add('is-touch'); },true);
{ const pad=$('tSteer'), knob=$('tKnob'); let id=null;
  const set=e=>{ const r=pad.getBoundingClientRect(); touchSteer=clamp((e.clientX-(r.left+r.width/2))/(r.width/2*.72),-1,1); if(Math.abs(touchSteer)<.06) touchSteer=0; knob.style.transform='translateX('+(touchSteer*(r.width/2-34))+'px)'; };
  const end=e=>{ if(e.pointerId!==id) return; id=null; touchSteer=0; knob.style.transform=''; };
  pad.addEventListener('pointerdown',e=>{ id=e.pointerId; try{ pad.setPointerCapture(id); }catch(_){} set(e); e.preventDefault(); });
  pad.addEventListener('pointermove',e=>{ if(e.pointerId===id) set(e); });
  pad.addEventListener('pointerup',end); pad.addEventListener('pointercancel',end);
  const br=$('tBrake'); let bid=null;
  const bend_=e=>{ if(e.pointerId!==bid) return; bid=null; touchBrake=false; br.classList.remove('on'); };
  br.addEventListener('pointerdown',e=>{ bid=e.pointerId; try{ br.setPointerCapture(bid); }catch(_){} touchBrake=true; br.classList.add('on'); e.preventDefault(); });
  br.addEventListener('pointerup',bend_); br.addEventListener('pointercancel',bend_);
  $('tHorn').addEventListener('pointerdown',e=>{ honk(); e.preventDefault(); });
  stage.addEventListener('contextmenu',e=>e.preventDefault()); }

// ---------- start
let prev=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-prev)/1000); prev=now;
  if(state!=='pause'){ update(dt); if(state==='drive'||state==='arrived') updateHud(); }
  if(flashV>0){ flashV=Math.max(0,flashV-dt*1.6); elFlash.style.opacity=flashV; }
  updateAudio(); render(state==='pause'?0:dt);
}
function start(data){
  if(document.fonts&&document.fonts.load) document.fonts.load('700 46px "Barlow Condensed"').catch(()=>{});
  career=data&&data.career||0; resize(); setupContract(data&&data.idx||0,true); showBrief(!(data&&data.idx));
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({idx:cIdx,career}));
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data||{});

// uchwyt do testów automatycznych
window.__kurs={player,cars,get state(){return state;},get zones(){return zones;},get tLeft(){return tLeft;},get depot(){return depot;},get contract(){return contract;},keys,
  step(dt){ update(dt); },begin(i){ setupContract(i,true); startDrive(); }};
})();
</script>
